<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warm-up: buttons and accessible names</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      max-width: 40rem;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin: 1rem 0 2rem;
    }
    button {
      font: inherit;
      padding: 0.5rem 1rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    svg {
      width: 1.25rem;
      height: 1.25rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Warm-up: buttons and accessible names</h1>
    <p>This page contains five buttons. Four have an accessible name. One does not.</p>

    <h2>Buttons with accessible names</h2>
    <div class="group">
      <!-- Name from visible text -->
      <button type="button">Save</button>

      <!-- Name from visible text -->
      <button type="button">Cancel</button>

      <!-- Icon-only button, name from aria-label -->
      <button type="button" aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>

      <!-- Icon plus visible text, name from text -->
      <button type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2"/></svg>
        Search
      </button>
    </div>

    <h2>Deliberately broken</h2>
    <p>This icon-only button has no accessible name. The icon is hidden from assistive technology and there is no text or label.</p>
    <div class="group">
      <!-- BROKEN: no accessible name -->
      <button type="button">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2"/></svg>
      </button>
    </div>
  </main>
</body>
</html>
